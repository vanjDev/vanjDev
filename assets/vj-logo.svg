<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-labelledby="title desc">
  <title id="title">VJ metallic monogram</title>
  <desc id="desc">A clean, fully vector VJ logo reconstructed with smooth Bézier curves.</desc>
  <defs>
    <linearGradient id="metal-v" x1="26" y1="27" x2="101" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".20" stop-color="#e2e2e4"/>
      <stop offset=".50" stop-color="#a7a7ac"/>
      <stop offset=".78" stop-color="#56565c"/>
      <stop offset="1" stop-color="#eeeeef"/>
    </linearGradient>
    <linearGradient id="metal-j" x1="157" y1="27" x2="105" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdfdfd"/>
      <stop offset=".18" stop-color="#d1d1d4"/>
      <stop offset=".44" stop-color="#eeeeef"/>
      <stop offset=".70" stop-color="#76767c"/>
      <stop offset=".90" stop-color="#bdbdc1"/>
      <stop offset="1" stop-color="#f8f8f9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a7a80"/>
      <stop offset=".45" stop-color="#202024"/>
      <stop offset="1" stop-color="#5d5d63"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.25" result="blur"/>
      <feOffset dx="1.6" dy="2.4" result="offset"/>
      <feFlood flood-color="#000000" flood-opacity=".38"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark extruded edge -->
  <g transform="translate(2 3)" fill="url(#edge)" stroke="#17171b" stroke-width=".8" stroke-linejoin="round">
    <path d="M19 29 L50 29 L92 112 L105 84 L110 84 L113 90 L83 145 L77 145 Z"/>
    <path d="M141 29 L172 29 L160 61 L160 109 C160 137 147 157 125 166 C106 173 87 169 73 156 C92 160 108 154 120 142 C131 131 135 116 135 98 L147 64 L124 64 L132 48 Z"/>
  </g>

  <!-- Main polished faces -->
  <g filter="url(#soft-shadow)" stroke="#696970" stroke-width=".85" stroke-linejoin="round">
    <path fill="url(#metal-v)" d="M19 29 L50 29 L92 112 L105 84 L110 84 L113 90 L83 145 L77 145 Z"/>
    <path fill="url(#metal-j)" d="M141 29 L172 29 L160 61 L160 109 C160 137 147 157 125 166 C106 173 87 169 73 156 C92 160 108 154 120 142 C131 131 135 116 135 98 L147 64 L124 64 L132 48 Z"/>
  </g>

  <!-- Crisp bevel highlights -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".72" stroke-width=".75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 30 L49 30 L92 115"/>
    <path d="M142 30 L170 30 L158.5 60"/>
    <path d="M158.5 62 L158.5 108 C158.5 135 146 154 124 163"/>
    <path d="M122 164 C104 169 88 166 77 159"/>
  </g>

  <!-- Subtle lower-edge depth -->
  <g fill="none" stroke="#151519" stroke-opacity=".46" stroke-width=".8" stroke-linecap="round">
    <path d="M79 143 L82 143 L111 90"/>
    <path d="M75 157 C91 163 107 159 119 147"/>
  </g>
</svg>
